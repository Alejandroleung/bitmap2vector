<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="site" src="index.html" style="width:900px;height:400px"></iframe>
<pre id="log">boot...</pre>
<script>
const log=[];function p(s){log.push(s);document.getElementById('log').textContent=log.join('\n');}
function blobOf(u){const[h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:'image/png'});}
window.addEventListener('load',async()=>{
  const w=document.getElementById('site').contentWindow,doc=w.document;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  for(let t=0;t<200;t++){if(w.window&&w.window.Image)break;await wait(50);}await wait(600);
  const blob=await (await fetch('__flag.png')).blob();
  const inp=doc.getElementById('fileInput');
  const d=new w.DataTransfer();d.items.add(new w.File([blob],'flag.png',{type:'image/png'}));
  inp.files=d.files;inp.dispatchEvent(new w.Event('change',{bubbles:true}));
  await wait(1200);
  doc.getElementById('numberOfColors').value='16';
  doc.getElementById('convertBtn').click();
  let st='';
  for(let t=0;t<200;t++){st=(doc.querySelector('.status')||{}).textContent||'';if(st.includes('完成')||st.includes('失败'))break;await wait(500);}
  p('状态: '+st);
  p('量化错误: '+(w.__qerr||'（无）'));
  p('DONE');
});
</script></body></html>
